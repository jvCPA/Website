<script type="module">
/*
 * Hero stage: every certificate stands in a slowly spinning 3D ring around the name, under a
 * starry sky. Cards flip to show their title as they pass the front. Drag to spin, hover to
 * pause, click to bring one forward. Falls back to the still hero (App.html) on any failure.
 */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.__sceneBooted = true;
const App = window.ResumeApp;

if (App && !App.isStatic()) {
  start().catch((err) => {
    console.warn('[resume] 3D hero failed, showing the still hero instead.', err);
    App.enterStatic('3D error');
  });
}

async function start() {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const hero = document.querySelector('.hero');
  const stage = $('stage');
  const canvas = $('scene');
  const label = $('ring-label');

  let sheen = null; // shared glass texture for the certificate cards
  const COLORS = { stage: 0x0a1330, raised: 0x121d40, accent: 0x5266eb, periwinkle: 0x9cb4e8 };
  const mqMobile = window.matchMedia('(max-width: 900px)');
  const isMobile = () => mqMobile.matches;
  const lowPower = isMobile() || (navigator.hardwareConcurrency || 8) <= 2;

  // ── Renderer ───────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !lowPower, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lowPower ? 1.5 : 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping; // keep the certificates true to colour
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); App.enterStatic('WebGL context lost'); });

  const scene = new THREE.Scene();
  const stageColor = new THREE.Color(COLORS.stage);
  scene.background = stageColor;
  scene.fog = new THREE.FogExp2(COLORS.stage, 0.03);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.45;

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
  const LOOK = new THREE.Vector3();

  scene.add(new THREE.HemisphereLight(COLORS.periwinkle, COLORS.stage, 0.8));
  const key = new THREE.DirectionalLight(0xfff3e4, 2.2);
  key.position.set(-4, 7, 9);
  scene.add(key);
  const rim = new THREE.DirectionalLight(COLORS.accent, 3);
  rim.position.set(4, 3, -8);
  scene.add(rim);

  // ── Loading ───────────────────────────────────────────────────────────────
  const loaderBar = $('loader-bar');
  const loaderText = $('loader-text');
  const manager = new THREE.LoadingManager();
  manager.onProgress = (_url, loaded, total) => {
    const p = loaded / total;
    loaderBar.style.strokeDashoffset = String(132 * (1 - p));
    loaderText.textContent = 'Loading ' + Math.round(p * 100) + '%';
  };
  const texLoader = new THREE.TextureLoader(manager);
  texLoader.setCrossOrigin('anonymous');
  const loadTex = (url) => new Promise((resolve, reject) => texLoader.load(url, (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    resolve(t);
  }, undefined, () => reject(new Error('Could not load ' + url))));

  const certs = App.certificates;
  const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise((r) => setTimeout(r, 2500))]);
  const [textures] = await Promise.all([
    Promise.all(certs.map((c) => loadTex(App.asset('certs/' + c.id + '-thumb.webp')))),
    fontsReady
  ]);

  // ── Sky ───────────────────────────────────────────────────────────────────
  const sky = makeStarfield(lowPower ? 1400 : 3200, lowPower ? 900 : 2600);
  scene.add(sky);
  const shooting = lowPower ? null : makeShootingStars();
  if (shooting) scene.add(shooting.group);

  // ── The ring ──────────────────────────────────────────────────────────────
  const RADIUS = 3.8;
  const PAPER = 0.93; // keeps white paper (plus the glass sheen) under the bloom threshold
  const ring = new THREE.Group();
  scene.add(ring);
  const cards = certs.map((c, i) => makeCard(c, textures[i], i, certs.length));
  cards.forEach((card) => ring.add(card.group));
  const hitTargets = cards.flatMap((c) => c.hits);

  // soft pool of light on the floor of the ring
  ring.add(flatDisc(RADIUS * 2.6, radialTexture([[0, 'rgba(82,102,235,0.16)'], [0.55, 'rgba(82,102,235,0.05)'], [1, 'rgba(82,102,235,0)']], 512), THREE.AdditiveBlending, -0.62));

  // ── Soft background props (desktop only) ─────────────────────────────────
  const props = lowPower ? null : makeBackdropProps();

  // ── Post-processing ───────────────────────────────────────────────────────
  let composer = null;
  if (!lowPower) {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.55, 0.5, 1.05));
    composer.addPass(new OutputPass());
  }

  // ── Layout: camera above the ring so it reads as an ellipse around the name ─
  let W = 1, H = 1;
  const baseCam = new THREE.Vector3();
  function layout() {
    W = Math.max(1, stage.clientWidth);
    H = Math.max(1, stage.clientHeight);
    renderer.setSize(W, H, false);
    if (composer) composer.setSize(W, H);
    camera.aspect = W / H;
    if (isMobile()) {
      // the ring runs off both sides on a phone; the front cards stay big enough to read
      camera.fov = 34;
      camera.position.set(0, 6.4, 12.5);
      LOOK.set(0, 1.25, 0);
    } else {
      camera.fov = 30;
      const push = Math.pow(Math.max(1, 1.7 / camera.aspect), 0.8);
      camera.position.set(0, 6.9 * push, 12 * push);
      LOOK.set(0, -0.35, 0);
    }
    baseCam.copy(camera.position);
    camera.lookAt(LOOK);
    camera.updateProjectionMatrix();
    if (props) props.resize(W, H);
    sky.material.uniforms.uScale.value = renderer.getPixelRatio();
  }
  layout();
  new ResizeObserver(layout).observe(stage);

  // ── Spin: slow auto rotation, drag with inertia, pause while hovering ────
  const AUTO = 0.11; // radians per second, one turn in about a minute
  const spin = { angle: 0, vel: 0, dragging: false };

  // ── Pointer ───────────────────────────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const pointer = { id: null, startX: 0, startY: 0, lastX: 0, lastT: 0, moved: 0 };
  const parallax = new THREE.Vector2();
  let hovered = null;
  let openCard = null;

  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(hitTargets, false)[0];
    return hit ? hit.object.userData.card : null;
  }
  function setHovered(card) {
    if (hovered === card) return;
    if (hovered) hovered.hover = false;
    hovered = card;
    if (card) {
      card.hover = true;
      label.textContent = card.cert.title;
    }
    label.hidden = !card;
    canvas.style.cursor = card ? 'pointer' : (spin.dragging ? 'grabbing' : 'grab');
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (openCard) return;
    pointer.id = e.pointerId;
    pointer.startX = pointer.lastX = e.clientX;
    pointer.startY = e.clientY;
    pointer.lastT = performance.now();
    pointer.moved = 0;
    spin.dragging = true;
    spin.vel = 0;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    parallax.set(((e.clientX - r.left) / r.width) * 2 - 1, ((e.clientY - r.top) / r.height) * 2 - 1);
    if (spin.dragging && e.pointerId === pointer.id) {
      const now = performance.now();
      const dx = e.clientX - pointer.lastX;
      const dt = Math.max(1, now - pointer.lastT) / 1000;
      pointer.moved += Math.abs(dx) + Math.abs(e.clientY - pointer.startY) * 0.2;
      const d = dx * (isMobile() ? 0.009 : 0.0055); // drag right: the front of the ring moves right
      spin.angle += d;
      spin.vel = THREE.MathUtils.clamp(spin.vel * 0.5 + (d / dt) * 0.5, -6, 6);
      pointer.lastX = e.clientX;
      pointer.lastT = now;
      if (pointer.moved > 6) setHovered(null);
      canvas.style.cursor = 'grabbing';
    } else if (e.pointerType === 'mouse' && !openCard) {
      setHovered(pick(e));
    }
  });
  const endDrag = (e) => {
    if (!spin.dragging || e.pointerId !== pointer.id) return;
    spin.dragging = false;
    if (performance.now() - pointer.lastT > 80) spin.vel = 0; // released after holding still
    if (e.type === 'pointerup' && pointer.moved < 6) {
      const card = pick(e);
      if (card) open(card);
    }
    canvas.style.cursor = hovered ? 'pointer' : 'grab';
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', () => { if (!spin.dragging) setHovered(null); parallax.set(0, 0); });
  canvas.style.cursor = 'grab';

  // Keyboard: a focusable list of every certificate in the ring
  const keyList = $('cert-keys-list');
  cards.forEach((card) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = card.cert.title;
    b.setAttribute('aria-label', 'Open certificate: ' + card.cert.title);
    b.addEventListener('focus', () => setHovered(card));
    b.addEventListener('blur', () => setHovered(null));
    b.addEventListener('click', () => open(card, b));
    card.keyButton = b;
    keyList.appendChild(wrapLi(b));
  });

  // Read-only hook used by the automated browser tests.
  window.__resumeScene = {
    get angle() { return THREE.MathUtils.radToDeg(spin.angle); },
    get openId() { return openCard ? openCard.cert.id : null; },
    get flipping() { return cards.filter((c) => c.flip > 0).map((c) => c.cert.id); },
    cardScreen(i) {
      const v = cards[i].group.getWorldPosition(new THREE.Vector3());
      const z = v.z;
      v.project(camera);
      const r = canvas.getBoundingClientRect();
      return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height, z };
    }
  };

  // ── Detail panel ──────────────────────────────────────────────────────────
  const panel = $('cert-panel');
  let returnFocus = null;
  function open(card, from) {
    if (openCard) return;
    openCard = card;
    returnFocus = from || null; // pointer users keep their place; keyboard users return to the key
    setHovered(null);
    card.state = 'toFront';
    card.anim = 0;
    card.group.updateWorldMatrix(true, false);
    card.from.copy(card.group.position);
    card.fromQuat.copy(card.group.quaternion);
    card.fromScale = card.group.scale.x;
    const c = card.cert;
    $('cp-title').textContent = c.title;
    $('cp-issuer').textContent = c.issuer;
    $('cp-year').textContent = c.year;
    $('cp-category').textContent = c.category;
    const verify = $('cp-verify');
    verify.hidden = !c.verifyUrl;
    if (c.verifyUrl) verify.href = c.verifyUrl;
    panel.hidden = false;
    hero.classList.add('is-panel-open');
    $('cp-title').tabIndex = -1;
    setTimeout(() => $('cp-title').focus({ preventScroll: true }), 50);
  }
  function close() {
    if (!openCard || openCard.state === 'toRing') return;
    openCard.state = 'toRing';
    openCard.anim = 0;
    openCard.from.copy(openCard.group.position);
    openCard.fromQuat.copy(openCard.group.quaternion);
    openCard.fromScale = openCard.group.scale.x;
    panel.hidden = true;
    hero.classList.remove('is-panel-open');
    if (returnFocus) returnFocus.focus({ preventScroll: true });
    else if (panel.contains(document.activeElement)) document.activeElement.blur();
  }
  $('cp-close').addEventListener('click', close);
  $('cp-full').addEventListener('click', () => { if (openCard) App.openLightbox(openCard.cert.id); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && openCard && !document.getElementById('lightbox').open) close();
  });

  // ── Loop (paused when the hero is off screen or the tab is hidden) ───────
  const clock = new THREE.Clock();
  let heroVisible = true;
  let running = false;
  new IntersectionObserver((entries) => {
    heroVisible = entries[0].isIntersecting;
    schedule();
  }, { threshold: 0 }).observe(hero);
  document.addEventListener('visibilitychange', schedule);

  function schedule() {
    const shouldRun = heroVisible && !document.hidden && !App.isStatic();
    if (shouldRun && !running) {
      running = true;
      clock.getDelta();
      requestAnimationFrame(frame);
    } else if (!shouldRun) {
      running = false;
    }
  }
  function frame() {
    if (!running) return;
    requestAnimationFrame(frame);
    step();
  }

  const slot = new THREE.Vector3();
  const slotQuat = new THREE.Quaternion();
  const frontPos = new THREE.Vector3();
  const frontQuat = new THREE.Quaternion();
  const yAxis = new THREE.Vector3(0, 1, 0);
  const flipQuat = new THREE.Quaternion();
  const tmpV = new THREE.Vector3();
  const FLIP_TIME = 3.4; // seconds: turn to the title side, hold, turn back to the certificate
  let lastFlipStart = -10;

  function step() {
    const dt = Math.min(clock.getDelta(), 1 / 20);
    const now = clock.elapsedTime;
    const mobile = isMobile();

    // spin
    if (!spin.dragging) {
      const target = hovered || openCard ? 0 : AUTO;
      spin.vel += (target - spin.vel) * (1 - Math.exp(-dt * (hovered ? 6 : 1.4)));
      spin.angle += spin.vel * dt;
    }
    const fastSpin = Math.abs(spin.vel) > AUTO * 2.5 || spin.dragging;

    // gentle camera parallax
    camera.position.x += (baseCam.x + parallax.x * 0.5 - camera.position.x) * (1 - Math.exp(-dt * 2.5));
    camera.position.y += (baseCam.y - parallax.y * 0.25 - camera.position.y) * (1 - Math.exp(-dt * 2.5));
    camera.lookAt(LOOK);

    // where a pulled-out card sits: in front of the ring, toward the camera
    // on the camera's line of sight and parallel to the screen, so it reads as a flat rectangle
    frontQuat.copy(camera.quaternion);
    frontPos.set(mobile ? 0 : 0.95, mobile ? 0.55 : 0, mobile ? -6.2 : -5.6).applyQuaternion(frontQuat).add(camera.position);

    for (const card of cards) {
      const theta = card.base + spin.angle;
      // position on the ring, with a slow wave so the ring never looks rigid
      slot.set(Math.sin(theta) * RADIUS, Math.sin(card.base * 3 + now * 0.35) * 0.12 + Math.sin(now * 0.9 + card.base * 5) * 0.03, Math.cos(theta) * RADIUS);
      const lift = card.hover ? 0.35 : 0;
      card.lift += (lift - card.lift) * (1 - Math.exp(-dt * 10));
      slot.addScaledVector(tmpV.set(Math.sin(theta), 0, Math.cos(theta)), card.lift);
      slotQuat.setFromAxisAngle(yAxis, theta);

      // flip: as a card passes the front it turns to its title side, holds, then turns back
      const facing = Math.atan2(Math.sin(theta), Math.cos(theta)); // 0 = straight at the camera
      if (card.flip === 0 && !card.flippedThisPass && !fastSpin && !openCard && card.state === 'ring'
          && Math.abs(facing) < 0.22 && now - lastFlipStart > 1.2) {
        card.flip = 0.0001;
        card.flippedThisPass = true;
        lastFlipStart = now;
      }
      if (Math.abs(facing) > 1.3) card.flippedThisPass = false;
      if (card.flip > 0) {
        card.flip += dt / FLIP_TIME;
        if (card.flip >= 1 || card.state !== 'ring') card.flip = 0;
      }
      const f = card.flip;
      const flipAngle = f === 0 ? 0 : f < 0.22 ? easeInOutCubic(f / 0.22) * Math.PI
        : f < 0.78 ? Math.PI : Math.PI + easeInOutCubic((f - 0.78) / 0.22) * Math.PI;
      if (flipAngle) slotQuat.multiply(flipQuat.setFromAxisAngle(yAxis, flipAngle));

      const g = card.group;
      if (card.state === 'ring') {
        g.position.copy(slot);
        g.quaternion.copy(slotQuat);
        const s = card.hover ? 1.1 : 1;
        g.scale.setScalar(g.scale.x + (s - g.scale.x) * (1 - Math.exp(-dt * 10)));
      } else if (card.state === 'toFront' || card.state === 'front') {
        card.anim = Math.min(1, card.anim + dt / 0.9);
        const e = easeOutExpo(card.anim);
        g.position.lerpVectors(card.from, frontPos, e);
        g.quaternion.slerpQuaternions(card.fromQuat, frontQuat, e);
        g.scale.setScalar(THREE.MathUtils.lerp(card.fromScale, mobile ? 1.55 : 2.05, e));
        if (card.anim >= 1) card.state = 'front';
      } else if (card.state === 'toRing') {
        card.anim = Math.min(1, card.anim + dt / 0.8);
        const e = easeInOutCubic(card.anim);
        g.position.lerpVectors(card.from, slot, e);
        g.quaternion.slerpQuaternions(card.fromQuat, slotQuat, e);
        g.scale.setScalar(THREE.MathUtils.lerp(card.fromScale, 1, e));
        if (card.anim >= 1) { card.state = 'ring'; openCard = null; }
      }

      const glow = card.hover ? 1 : 0;
      card.glow += (glow - card.glow) * (1 - Math.exp(-dt * 10));
      card.frameMat.emissiveIntensity = card.glow * 2.2;
      card.haloMat.opacity = card.glow * 0.55;
      const dim = openCard && openCard !== card ? 0.35 : PAPER;
      const c = card.imgMat.color.r + (dim - card.imgMat.color.r) * (1 - Math.exp(-dt * 6));
      card.imgMat.color.setScalar(c);
      card.backMat.color.setScalar(c);
    }

    // hover label follows the card
    if (hovered && !openCard) {
      hovered.group.getWorldPosition(tmpV);
      tmpV.y += hovered.height * 0.62;
      tmpV.project(camera);
      label.style.transform = `translate(${((tmpV.x + 1) / 2 * W).toFixed(1)}px, ${((1 - tmpV.y) / 2 * H).toFixed(1)}px) translate(-50%, -100%)`;
    }

    sky.rotation.y = now * 0.006;
    sky.material.uniforms.uTime.value = now;
    if (shooting) shooting.update(dt, now);

    if (props) props.render(renderer, camera, now, scene);
    if (composer) composer.render(dt);
    else renderer.render(scene, camera);
  }

  // first frame, then reveal
  step();
  root.classList.add('is-ready');
  $('loader').setAttribute('aria-hidden', 'true');
  window.__sceneReady = true;
  schedule();

  // ─────────────────────────────────────────────────────────────────────────
  //  Builders
  // ─────────────────────────────────────────────────────────────────────────

  /** One certificate: a thin metal frame, the certificate on the front, its title card on the back. */
  function makeCard(cert, tex, i, n) {
    const img = tex.image;
    const aspect = img.width / img.height;
    const width = aspect >= 1 ? 0.98 : 0.7 * aspect;
    const height = aspect >= 1 ? 0.98 / aspect : 0.7;
    const scale = 1;

    const group = new THREE.Group();
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x9aa6c8, metalness: 0.92, roughness: 0.24, emissive: COLORS.accent, emissiveIntensity: 0 });
    const frame = new THREE.Mesh(new RoundedBoxGeometry(width + 0.07, height + 0.07, 0.03, 3, 0.018), frameMat);
    group.add(frame);

    const imgMat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, color: new THREE.Color(PAPER, PAPER, PAPER) });
    const front = new THREE.Mesh(new THREE.PlaneGeometry(width, height), imgMat);
    front.position.z = 0.0165;
    group.add(front);

    const backMat = new THREE.MeshBasicMaterial({ map: titleCardTexture(cert, aspect), toneMapped: false });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(width, height), backMat);
    back.position.z = -0.0165;
    back.rotation.y = Math.PI;
    group.add(back);

    const glassMat = new THREE.MeshBasicMaterial({
      map: sheenTexture(), transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
    });
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(width, height), glassMat);
    glass.position.z = 0.018;
    group.add(glass);

    const haloMat = new THREE.MeshBasicMaterial({
      map: radialTexture([[0, 'rgba(120,140,255,1)'], [0.55, 'rgba(82,102,235,0.45)'], [1, 'rgba(82,102,235,0)']]),
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, side: THREE.DoubleSide
    });
    const halo = new THREE.Mesh(new THREE.PlaneGeometry(width * 1.9, height * 1.9), haloMat);
    halo.renderOrder = -1;
    group.add(halo);

    const card = {
      cert, group, frameMat, imgMat, backMat, haloMat, width, height, scale,
      hits: [frame, front, back],
      base: (i / n) * Math.PI * 2,
      state: 'ring', anim: 0, hover: false, glow: 0, lift: 0, flip: 0, flippedThisPass: false,
      from: new THREE.Vector3(), fromQuat: new THREE.Quaternion(), fromScale: 1
    };
    card.hits.forEach((m) => { m.userData.card = card; });
    return card;
  }

  /** The back of a card: a clean navy title card, readable from across the ring. */
  function titleCardTexture(cert, aspect) {
    const w = 640;
    const h = Math.round(w / aspect);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#121d40';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#5266eb';
    ctx.fillRect(0, 0, w, 10);
    const pad = Math.round(w * 0.08);
    const font = (size, weight) => `${weight} ${size}px Inter, system-ui, sans-serif`;
    ctx.textBaseline = 'top';
    let y = pad;
    ctx.fillStyle = '#9cb4e8';
    ctx.font = font(26, 500);
    ctx.fillText(cert.category, pad, y);
    y += 52;
    ctx.fillStyle = '#ededf3';
    const titleSize = aspect >= 1 ? 44 : 50;
    ctx.font = font(titleSize, 500);
    y = wrapText(ctx, cert.title, pad, y, w - pad * 2, titleSize * 1.18, aspect >= 1 ? 3 : 5);
    y += 18;
    ctx.fillStyle = '#c3c3cc';
    ctx.font = font(26, 400);
    y = wrapText(ctx, cert.issuer, pad, y, w - pad * 2, 34, 2);
    ctx.fillStyle = '#9cb4e8';
    ctx.font = font(30, 500);
    ctx.fillText(cert.year, pad, h - pad - 30);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
    const words = String(text).split(' ');
    let line = '';
    let lines = 0;
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        if (lines === maxLines - 1) { ctx.fillText(line + '…', x, y); return y + lineH; }
        ctx.fillText(line, x, y);
        y += lineH;
        lines++;
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) { ctx.fillText(line, x, y); y += lineH; }
    return y;
  }

  /** Twinkling stars on a far shell, plus a faint band of tiny stars like the Milky Way. */
  function makeStarfield(count, bandCount) {
    const total = count + bandCount;
    const pos = new Float32Array(total * 3);
    const size = new Float32Array(total);
    const seed = new Float32Array(total);
    const tint = new Float32Array(total);
    const v = new THREE.Vector3();
    const band = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.5, 0, 0.42));
    for (let i = 0; i < total; i++) {
      const r = 45 + Math.random() * 40;
      if (i < count) {
        // uniform on the whole sphere: the camera looks down, so the sky behind the ring matters most
        const u = Math.random() * 2 - 1;
        const a = Math.random() * Math.PI * 2;
        const s = Math.sqrt(1 - u * u);
        v.set(s * Math.cos(a), u, s * Math.sin(a));
        const bright = Math.random() < 0.06;
        size[i] = bright ? 3.2 + Math.random() * 2.2 : 1.2 + Math.random() * 1.6;
        tint[i] = bright ? 2.2 : 0.95 + Math.random() * 0.6;
      } else {
        // a soft tilted band
        const a = Math.random() * Math.PI * 2;
        const spread = (Math.random() + Math.random() + Math.random() - 1.5) * 0.22;
        v.set(Math.cos(a), spread, Math.sin(a)).applyQuaternion(band);
        size[i] = 0.9 + Math.random() * 0.9;
        tint[i] = 0.4 + Math.random() * 0.35;
      }
      v.normalize().multiplyScalar(r);
      pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
      seed[i] = Math.random();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    geo.setAttribute('aTint', new THREE.BufferAttribute(tint, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uScale: { value: 1 }, uWarm: { value: new THREE.Color(0xfff1dc) }, uCool: { value: new THREE.Color(COLORS.periwinkle) } },
      vertexShader: /* glsl */`
        attribute float aSize; attribute float aSeed; attribute float aTint;
        uniform float uTime; uniform float uScale;
        varying float vA; varying float vSeed; varying float vTint;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          float tw = 0.65 + 0.35 * sin(uTime * (0.6 + aSeed * 2.2) + aSeed * 40.0);
          gl_PointSize = aSize * uScale * (0.85 + 0.3 * tw);
          vA = tw; vSeed = aSeed; vTint = aTint;
        }`,
      fragmentShader: /* glsl */`
        uniform vec3 uWarm; uniform vec3 uCool;
        varying float vA; varying float vSeed; varying float vTint;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float core = smoothstep(0.5, 0.0, d);
          float a = core * vA;
          vec3 col = mix(uCool, uWarm, step(0.6, vSeed)) * vTint;
          gl_FragColor = vec4(col * a, a);
          #include <colorspace_fragment>
        }`
    });
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    points.renderOrder = -2;
    return points;
  }

  /** Now and then a thin streak crosses the sky. */
  function makeShootingStars() {
    const group = new THREE.Group();
    const c = document.createElement('canvas');
    c.width = 256; c.height = 8;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 256, 0);
    grad.addColorStop(0, 'rgba(156,180,232,0)');
    grad.addColorStop(0.85, 'rgba(220,230,255,0.75)');
    grad.addColorStop(1, 'rgba(255,255,255,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 2, 256, 4);
    const tex = new THREE.CanvasTexture(c);
    const streaks = [0, 1].map(() => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(5, 0.05), new THREE.MeshBasicMaterial({
        map: tex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false
      }));
      m.visible = false;
      group.add(m);
      return { m, life: 0, vel: new THREE.Vector3() };
    });
    let next = 4 + Math.random() * 5;
    return {
      group,
      update(dt, now) {
        if (now > next) {
          next = now + 6 + Math.random() * 8;
          const s = streaks.find((x) => x.life <= 0);
          if (s) {
            const dir = Math.random() < 0.5 ? 1 : -1;
            s.m.position.set(-dir * (8 + Math.random() * 10), 9 + Math.random() * 6, -30 - Math.random() * 10);
            s.vel.set(dir * (22 + Math.random() * 10), -(7 + Math.random() * 5), 0);
            s.m.rotation.z = Math.atan2(s.vel.y, s.vel.x);
            s.life = 1;
            s.m.visible = true;
          }
        }
        for (const s of streaks) {
          if (s.life <= 0) continue;
          s.life -= dt / 1.1;
          s.m.position.addScaledVector(s.vel, dt);
          s.m.material.opacity = Math.sin(Math.max(0, s.life) * Math.PI) * 0.9;
          if (s.life <= 0) s.m.visible = false;
        }
      }
    };
  }

  /**
   * Three small stylised props (calculator, robot, bar chart), one per pillar.
   * They render into a low-resolution target that is blurred and used as the stage background,
   * so they always sit behind the ring and read as out of focus.
   */
  function makeBackdropProps() {
    const propScene = new THREE.Scene();
    propScene.background = stageColor;
    propScene.fog = new THREE.FogExp2(COLORS.stage, 0.028);
    propScene.environment = scene.environment;
    propScene.environmentIntensity = 0.5;
    propScene.add(new THREE.HemisphereLight(COLORS.periwinkle, COLORS.stage, 0.9));
    const pkey = new THREE.DirectionalLight(0xffffff, 2.6);
    pkey.position.set(-3, 5, 6);
    propScene.add(pkey);

    const items = [
      { obj: buildCalculator(), pos: [-6.2, 3.6, -9.5], scale: 1.0, spin: 0.18 },
      { obj: buildRobot(), pos: [6.4, 4.2, -10.5], scale: 0.95, spin: -0.22 },
      { obj: buildBarChart(), pos: [5.6, -0.6, -8.5], scale: 0.95, spin: 0.14 }
    ];
    items.forEach((it, i) => {
      it.obj.position.set(...it.pos);
      it.obj.scale.setScalar(it.scale);
      it.obj.rotation.set(0.25, 0.6 * (i - 1), 0.1 * (1 - i));
      propScene.add(it.obj);
    });

    const rtOpts = { type: THREE.HalfFloatType, colorSpace: THREE.LinearSRGBColorSpace, depthBuffer: true };
    const rtA = new THREE.WebGLRenderTarget(4, 4, rtOpts);
    const rtB = new THREE.WebGLRenderTarget(4, 4, { ...rtOpts, depthBuffer: false });
    const blurMat = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: { uTex: { value: null }, uDir: { value: new THREE.Vector2() } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: /* glsl */`
        uniform sampler2D uTex; uniform vec2 uDir; varying vec2 vUv;
        void main() {
          vec4 c = texture2D(uTex, vUv) * 0.227027;
          c += texture2D(uTex, vUv + uDir * 1.3846) * 0.316216;
          c += texture2D(uTex, vUv - uDir * 1.3846) * 0.316216;
          c += texture2D(uTex, vUv + uDir * 3.2308) * 0.070270;
          c += texture2D(uTex, vUv - uDir * 3.2308) * 0.070270;
          gl_FragColor = c;
        }`
    });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurMat);
    quad.frustumCulled = false;
    const quadScene = new THREE.Scene();
    quadScene.add(quad);
    const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    return {
      resize(w, h) {
        const s = 0.25;
        rtA.setSize(Math.max(2, Math.round(w * s)), Math.max(2, Math.round(h * s)));
        rtB.setSize(rtA.width, rtA.height);
      },
      render(r, cam, now, mainScene) {
        items.forEach((it, i) => {
          it.obj.rotation.y += it.spin * 0.016;
          it.obj.position.y = it.pos[1] + Math.sin(now * 0.5 + i * 2.1) * 0.12;
        });
        const prevTarget = r.getRenderTarget();
        r.setRenderTarget(rtA);
        r.render(propScene, cam);
        blurMat.uniforms.uTex.value = rtA.texture;
        blurMat.uniforms.uDir.value.set(1 / rtA.width, 0);
        r.setRenderTarget(rtB);
        r.render(quadScene, quadCam);
        blurMat.uniforms.uTex.value = rtB.texture;
        blurMat.uniforms.uDir.value.set(0, 1 / rtA.height);
        r.setRenderTarget(rtA);
        r.render(quadScene, quadCam);
        r.setRenderTarget(prevTarget);
        mainScene.background = rtA.texture;
      }
    };
  }

  function propMaterials() {
    return {
      body: new THREE.MeshStandardMaterial({ color: 0x1b2a5c, metalness: 0.35, roughness: 0.45 }),
      light: new THREE.MeshStandardMaterial({ color: 0x8e9ccc, metalness: 0.1, roughness: 0.5 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x0c1533, metalness: 0.2, roughness: 0.3 }),
      accent: new THREE.MeshStandardMaterial({ color: COLORS.accent, emissive: COLORS.accent, emissiveIntensity: 0.6, roughness: 0.35 }),
      glow: new THREE.MeshBasicMaterial({ color: new THREE.Color(COLORS.periwinkle), toneMapped: false })
    };
  }

  // Calculator: rounded slab, inset display, 4×5 keypad, accent equals key.
  function buildCalculator() {
    const m = propMaterials();
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new RoundedBoxGeometry(1.0, 1.4, 0.16, 4, 0.08), m.body));
    const screen = new THREE.Mesh(new RoundedBoxGeometry(0.8, 0.3, 0.04, 2, 0.02), m.dark);
    screen.position.set(0, 0.47, 0.08);
    g.add(screen);
    const digits = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.1), m.glow);
    digits.position.set(0.1, 0.47, 0.105);
    g.add(digits);
    const keyGeo = new RoundedBoxGeometry(0.16, 0.13, 0.06, 2, 0.025);
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 4; c++) {
        const isEq = r === 4 && c === 3;
        const k = new THREE.Mesh(keyGeo, isEq ? m.accent : (c === 3 ? m.light : m.dark));
        k.position.set(-0.3 + c * 0.2, 0.17 - r * 0.17, 0.09);
        g.add(k);
      }
    }
    return g;
  }

  // Robot: rounded head with a dark visor, two glowing eyes, ear pods and an antenna.
  function buildRobot() {
    const m = propMaterials();
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.85, 0.85, 5, 0.22), m.light));
    const visor = new THREE.Mesh(new RoundedBoxGeometry(0.86, 0.42, 0.1, 3, 0.1), m.dark);
    visor.position.set(0, 0.0, 0.4);
    g.add(visor);
    const eyeGeo = new THREE.CapsuleGeometry(0.055, 0.09, 4, 12);
    [-0.2, 0.2].forEach((x) => {
      const eye = new THREE.Mesh(eyeGeo, m.glow);
      eye.position.set(x, 0.01, 0.46);
      g.add(eye);
    });
    const earGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.12, 24);
    [-0.6, 0.6].forEach((x) => {
      const ear = new THREE.Mesh(earGeo, m.accent);
      ear.rotation.z = Math.PI / 2;
      ear.position.set(x, 0, 0);
      g.add(ear);
    });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.28, 12), m.body);
    stem.position.y = 0.56;
    g.add(stem);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 20, 16), m.glow);
    tip.position.y = 0.74;
    g.add(tip);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.18, 24), m.body);
    neck.position.y = -0.5;
    g.add(neck);
    return g;
  }

  // Bar chart: a base tile with four rising bars, the last one in the accent colour.
  function buildBarChart() {
    const m = propMaterials();
    const g = new THREE.Group();
    const baseTile = new THREE.Mesh(new RoundedBoxGeometry(1.4, 0.08, 0.7, 2, 0.03), m.body);
    g.add(baseTile);
    [0.35, 0.6, 0.48, 0.95].forEach((h, i) => {
      const bar = new THREE.Mesh(new RoundedBoxGeometry(0.22, h, 0.22, 2, 0.04), i === 3 ? m.accent : m.light);
      bar.position.set(-0.45 + i * 0.3, 0.04 + h / 2, 0);
      g.add(bar);
    });
    return g;
  }

  // ── Small helpers ────────────────────────────────────────────────────────
  function flatDisc(size, map, blending, y) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({
      map, transparent: true, depthWrite: false, blending, toneMapped: false
    }));
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = y;
    return mesh;
  }
  function radialTexture(stops, size = 128) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const half = size / 2;
    const g = ctx.createRadialGradient(half, half, 0, half, half, half);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    // a touch of noise so large soft glows don't band
    const img = ctx.getImageData(0, 0, size, size);
    for (let i = 0; i < img.data.length; i += 4) img.data[i + 3] = Math.max(0, Math.min(255, img.data[i + 3] + (Math.random() - 0.5) * 3));
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  function sheenTexture() {
    if (sheen) return sheen;
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 128, 128);
    g.addColorStop(0, 'rgba(255,255,255,0.0)');
    g.addColorStop(0.42, 'rgba(255,255,255,0.0)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.22)');
    g.addColorStop(0.58, 'rgba(255,255,255,0.0)');
    g.addColorStop(1, 'rgba(255,255,255,0.06)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    sheen = new THREE.CanvasTexture(c);
    sheen.colorSpace = THREE.SRGBColorSpace;
    return sheen;
  }
  function wrapLi(node) {
    const li = document.createElement('li');
    li.appendChild(node);
    return li;
  }
  function easeOutExpo(x) { return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); }
  function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
}
</script>
